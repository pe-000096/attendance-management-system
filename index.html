<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけで使えるシンプルな勤怠管理システム">
  <title>出勤簿 | 勤怠管理台帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Zen+Kurenaido&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="inkrough">
    <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
  </filter></svg>

  <main class="sheet">
    <span class="hole h1" aria-hidden="true"></span>
    <span class="hole h2" aria-hidden="true"></span>
    <p class="form-no">様式第一号（第四条関係）</p>
    <p class="keep">保存期間　五年</p>

    <header>
      <div class="title-block">
        <p class="tate" id="tateLabel"></p>
        <div>
          <h1>出勤簿</h1>
          <p class="subtitle">— 勤怠管理台帳 —</p>
        </div>
      </div>
      <div class="head-right">
        <p class="wa-date" id="today"></p>
        <p class="name">氏名<button type="button" class="pen" id="userName" title="クリックして氏名を記入">（未記入）</button></p>
      </div>
    </header>

    <section class="now">
      <div class="now-left">
        <div class="stamp" id="status"><span>未出勤</span></div>
        <div>
          <p class="clock-label">現在時刻</p>
          <p class="clock" id="clock">--:--</p>
        </div>
      </div>
      <div class="actions">
        <button id="clockIn" class="in"><span>出勤</span></button>
        <button id="breakStart"><span>休憩入</span></button>
        <button id="breakEnd"><span>休憩戻</span></button>
        <button id="clockOut" class="out"><span>退勤</span></button>
      </div>
    </section>

    <div class="ledger-head">
      <h2 id="ledgerTitle">記録</h2>
      <div class="tools">
        <input type="month" id="monthFilter" aria-label="対象月">
        <button id="exportCsv" class="tool-link">CSVに書き出す</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>日付</th><th>曜日</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>状態</th><th class="c">認印</th><th></th></tr></thead>
        <tbody id="recordsBody"></tbody>
        <tfoot id="recordsFoot" hidden><tr><td colspan="2">合計</td><td colspan="7">
          <div class="tally">
            <span>勤務日数<b id="workDays">0日</b></span>
            <span>総勤務<b id="totalHours">0:00</b></span>
            <span>平均<b id="averageHours">0:00</b></span>
            <span>残業<b id="overtimeHours">0:00</b></span>
          </div>
        </td></tr></tfoot>
      </table>
    </div>
    <p class="empty" id="empty">この月の記載はありません。</p>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <h2>勤怠の修正</h2>
      <input type="hidden" id="editDate">
      <label>出勤時刻<input type="time" id="editIn" required></label>
      <label>退勤時刻<input type="time" id="editOut" required></label>
      <label>休憩（分）<input type="number" id="editBreak" min="0" max="600" required></label>
      <div class="dialog-actions"><button value="cancel">取消</button><button class="primary" value="default" id="saveEdit">記帳する</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
